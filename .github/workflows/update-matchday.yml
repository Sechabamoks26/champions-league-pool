name: Update pool after matchday

on:
  schedule:
    # Daily at 06:00 UTC during the league phase (Sep 2026 – Jan 2027)
    - cron: "0 6 * * *"
    # Extra run at 23:00 UTC on typical match nights (Tue–Thu)
    - cron: "0 23 * * 2,3,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch results and compute standings
        run: node scripts/update-results.mjs
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json data/pool-standings.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update pool standings after UEFA matchday"
            git push
          fi
